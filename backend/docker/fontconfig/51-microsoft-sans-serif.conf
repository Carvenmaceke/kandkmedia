<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The payslip template's runs are all set to "Microsoft Sans Serif" (a
  Windows-only font, unavailable on Linux). Without this rule, fontconfig's
  default substitution picks DejaVu Sans, which is measurably wider than
  Microsoft Sans Serif — wide enough that several of the template's tightly
  laid-out label boxes (e.g. the "Amount" / "Opening Balance" column headers)
  overlap when rendered. Liberation Sans (metric-compatible with Arial, and
  narrower than DejaVu Sans for this template's text) was verified — via a
  full audit of every static label's text width vs. its box width — to fit
  every shape in the template with a positive margin, where DejaVu Sans did
  not. Binding="strong" makes this override the document's own font request
  rather than just being a fallback candidate.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Microsoft Sans Serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
