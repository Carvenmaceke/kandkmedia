server:
  # Render (and most hosts) inject PORT at runtime and expect the app to
  # bind to it — falls back to 8080 for local development.
  port: ${PORT:8080}
  error:
    # Spring Boot hides the actual exception message from error responses
    # by default (just "status":500,"error":"Internal Server Error") —
    # include it so a failure like payslip PDF generation crashing server-
    # side (e.g. LibreOffice missing) is diagnosable from the client error
    # message instead of only from server logs nobody outside ops can see.
    # Never includes the stack trace itself.
    include-message: always

spring:
  application:
    name: kandkmedia-payroll-system

  datasource:
    # Aiven (and most managed MySQL) requires SSL — include sslMode=REQUIRED
    # in DB_URL, e.g.:
    #   jdbc:mysql://<host>:<port>/<database>?sslMode=REQUIRED
    # Set DB_URL/DB_USERNAME/DB_PASSWORD as environment variables wherever
    # this runs — never hardcode real credentials here.
    url: ${DB_URL:jdbc:mysql://localhost:3306/kandkmedia_payroll?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    # Resend (and some other providers) require the SMTP auth username to be
    # a literal string like "resend", not an email address — so this can't
    # double as the From address. See app.mail-from below for that.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # The actual "From" address on outgoing emails — independent of
  # spring.mail.username above. Point this at onboarding@resend.dev for
  # testing before a sending domain is verified in Resend, or your real
  # verified address (e.g. payroll@kandkmedia.co.za) once it is.
  mail-from: ${MAIL_FROM:payroll@kandkmedia.co.za}
  mail:
    # "resend" (HTTPS API, default) or "smtp" (log in to a company mailbox).
    provider: ${MAIL_PROVIDER:resend}
    smtp:
      host: ${SMTP_HOST:mail.kandkmedia.co.za}
      port: ${SMTP_PORT:465}
      # ssl (465) / starttls (587) / none — blank picks from the port.
      security: ${SMTP_SECURITY:}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      # Sender address when it differs from the login (relays like Brevo) — must be verified there.
      from: ${SMTP_FROM:}
  jwt:
    # Override with a long random secret via the JWT_SECRET env var in every real environment.
    secret: ${JWT_SECRET:change-this-secret-before-deploying-to-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Only accounts with these email domains (comma-separated) may sign up —
  # mirrors the frontend's rule.
  allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:kandkmedia.co.za,insideeducation.co.za}
  # Where the QR code on a payslip points. Currently resolves to the JSON
  # verification API itself (see PublicController) — there's no human-facing
  # "Document Verified" webpage yet, so scanning it shows raw JSON for now.
  verification-base-url: ${VERIFICATION_BASE_URL:http://localhost:8080/api/public/verify}
  support-email: ${SUPPORT_EMAIL:itsupport@kandkmedia.co.za}
  # IT Assistant chatbot (Groq). Set GROQ_API_KEY as an environment variable
  # on the server — never commit it. Unset = the chat uses its built-in
  # keyword answers instead.
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  payslip-delivery:
    auto-send: ${PAYSLIP_AUTO_SEND:true}
    # The job checks daily at this hour:minute (server time) whether today
    # is the configured trigger day — see PayslipSchedulerService.
    cron-hour: ${PAYSLIP_CRON_HOUR:18}
    cron-minute: ${PAYSLIP_CRON_MINUTE:0}
    # LAST_DAY_OF_MONTH or DAY_BEFORE_MONTH_END
    send-on: ${PAYSLIP_SEND_ON:LAST_DAY_OF_MONTH}
