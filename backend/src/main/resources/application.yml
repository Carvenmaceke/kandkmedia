server:
  # Render (and most hosts) inject PORT at runtime and expect the app to
  # bind to it — falls back to 8080 for local development.
  port: ${PORT:8080}

spring:
  application:
    name: kandkmedia-payroll-system

  datasource:
    # Aiven (and most managed MySQL) requires SSL — include sslMode=REQUIRED
    # in DB_URL, e.g.:
    #   jdbc:mysql://<host>:<port>/<database>?sslMode=REQUIRED
    # Set DB_URL/DB_USERNAME/DB_PASSWORD as environment variables wherever
    # this runs — never hardcode real credentials here.
    url: ${DB_URL:jdbc:mysql://localhost:3306/kandkmedia_payroll?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # Override with a long random secret via the JWT_SECRET env var in every real environment.
    secret: ${JWT_SECRET:change-this-secret-before-deploying-to-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Only accounts with this email domain may sign up — mirrors the frontend's rule.
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:kandkmedia.co.za}
  # Where the QR code on a payslip points. Currently resolves to the JSON
  # verification API itself (see PublicController) — there's no human-facing
  # "Document Verified" webpage yet, so scanning it shows raw JSON for now.
  verification-base-url: ${VERIFICATION_BASE_URL:http://localhost:8080/api/public/verify}
  support-email: ${SUPPORT_EMAIL:itsupport@kandkmedia.co.za}
  payslip-delivery:
    auto-send: ${PAYSLIP_AUTO_SEND:true}
    # The job checks daily at this hour:minute (server time) whether today
    # is the configured trigger day — see PayslipSchedulerService.
    cron-hour: ${PAYSLIP_CRON_HOUR:18}
    cron-minute: ${PAYSLIP_CRON_MINUTE:0}
    # LAST_DAY_OF_MONTH or DAY_BEFORE_MONTH_END
    send-on: ${PAYSLIP_SEND_ON:LAST_DAY_OF_MONTH}
